version: '3.8'

services:
  db:
    image: postgres:15
    container_name: devportfolio_db
    restart: always
    environment:
      POSTGRES_DB: devportfolio_db
      POSTGRES_USER: devportfolio_user
      POSTGRES_PASSWORD: devportfolio_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devportfolio_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devportfolio_backend
    restart: always
    depends_on:
      - db
    environment:
      DB_NAME: devportfolio_db
      DB_USER: devportfolio_user
      DB_PASSWORD: devportfolio_password
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: your-secret-key-here
      DEBUG: 'False'
      ALLOWED_HOSTS: 'localhost,127.0.0.1,gusarov-dev.duckdns.org'
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
      - ./backend/static:/app/static
      - ./backend/staticfiles:/app/staticfiles
    networks:
      - devportfolio_network
    command: gunicorn --bind 0.0.0.0:8002 core_project.wsgi:application

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devportfolio_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - devportfolio_network
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:

networks:
  devportfolio_network:
    driver: bridge
